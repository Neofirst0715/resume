  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>

<body>
  <div id="__bundler_placeholder">Loading Neo Li — Portfolio...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t-size: 14px; line-height: 1.5; opacity: 0.85\">A live sea-surface-temperature pipeline for four Nova Scotia sites. I built the data layer and the Hobday et al. heatwave detection, then turned it into plain-language alerts a farm operator can act on.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px\">\n<span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">Next.js<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">TypeScript<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">NOAA ERDDAP<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">team of 2<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 20px; font-size: 13.5px; font-weight: 600\">\n<a href=\"https://bluefish-ivory.vercel.app\" style=\"text-decoration: underline; text-underline-offset: 4px\">Live demo ↗<\u002Fa>\n<a href=\"https://github.com/Neofirst0715/Bluefish\" style=\"text-decoration: underline; text-underline-offset: 4px\">GitHub ↗<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- card 4: RaceLens AR -->\n<div class=\"pf-card\" style=\"flex: 0 0 420px; height: 640px; box-sizing: border-box; border-radius: 28px; padding: 28px; background: #eef1f4; color: #0e1116; display: flex; flex-direction: column; gap: 16px\">\n<div>\n<div style=\"font-size: 13px; opacity: 0.72\">DeepSense Ocean of Data · Jun 2026<\u002Fdiv>\n<div style=\"font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; margin-top: 6px\">RaceLens AR<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.35; margin-top: 8px; opacity: 0.78; max-width: 330px\">Measured, ruled, or guessed. Always labelled.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-radius: 12px; background: #0e1116; color: #ffffff; font-size: 13.5px; font-weight: 600\"><span>Live fact<\u002Fspan><span style=\"font-weight: 500; opacity: 0.7\">measured<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-radius: 12px; box-sizing: border-box; border: 1.5px dashed #0e1116; font-size: 13.5px; font-weight: 600\"><span>Rule-triggered event<\u002Fspan><span style=\"font-weight: 500; opacity: 0.7\">rule<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-radius: 12px; box-sizing: border-box; border: 1.5px dotted rgba(14,17,22,0.55); font-size: 13.5px; font-weight: 600; color: rgba(14,17,22,0.8)\"><span>ML prediction<\u002Fspan><span style=\"font-weight: 500; opacity: 0.7\">model guess<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size: 46px; font-weight: 300; letter-spacing: -0.03em; line-height: 1\">52% → 70%<\u002Fdiv>\n<div style=\"font-size: 12.5px; opacity: 0.7; margin-top: 8px\">event-classification accuracy on unseen races<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.5; opacity: 0.85\">SailGP telemetry turned into spectator insight. I engineered four rolling-window features and trained the Random Forest; judges singled out the honest three-tier framing.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px\">\n<span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">Random Forest<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">React<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">Tableau<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">team of 2<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 20px; font-size: 13.5px; font-weight: 600\">\n<a href=\"https://www.youtube.com/watch?v=6CRQKmfGGpU\" style=\"text-decoration: underline; text-underline-offset: 4px\">Video demo ↗<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- card 5: Pingpin Context -->\n<div class=\"pf-card\" style=\"flex: 0 0 420px; height: 640px; box-sizing: border-box; border-radius: 28px; padding: 28px; background: #17202b; color: #ffffff; display: flex; flex-direction: column; gap: 16px\">\n<div>\n<div style=\"font-size: 13px; opacity: 0.72\">Devpost submission · Jul – Aug 2026<\u002Fdiv>\n<div style=\"font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; margin-top: 6px\">Pingpin Context<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.35; margin-top: 8px; opacity: 0.78; max-width: 330px\">Every rewrite leaves a trail.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex-grow: 1; display: flex; flex-direction: column; justify-content: center\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 30px; height: 30px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid {{accent}}; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600\">1<\u002Fdiv>\n<div style=\"font-size: 14.5px\">Stale record flagged <span style=\"opacity: 0.6\">· 1+ day past its last update<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width: 1.5px; height: 26px; margin-left: 14px; background: rgba(255,255,255,0.25)\"><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 30px; height: 30px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid {{accent}}; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600\">2<\u002Fdiv>\n<div style=\"font-size: 14.5px\">A human approves or overrides<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width: 1.5px; height: 26px; margin-left: 14px; background: rgba(255,255,255,0.25)\"><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 30px; height: 30px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid {{accent}}; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600\">3<\u002Fdiv>\n<div style=\"font-size: 14.5px\">Rewrite versioned into the lineage graph<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 26px; align-self: flex-start; padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); font-size: 12.5px\">2–3 overrides every review round<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.5; opacity: 0.85\">A daily freshness check on a live dbt project. Every flag goes to human approval, including the reviewer's own edits being re-flagged, and every approved rewrite lands in DataHub's lineage graph.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px\">\n<span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">dbt<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">DuckDB<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">DataHub (MCP)<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">LangGraph<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 20px; font-size: 13.5px; font-weight: 600\">\n<a href=\"https://www.youtube.com/watch?v=KWrZzPhWuZs\" style=\"text-decoration: underline; text-underline-offset: 4px\">Video walkthrough ↗<\u002Fa>\n<a href=\"https://github.com/Neofirst0715/Pingpin-context\" style=\"text-decoration: underline; text-underline-offset: 4px\">GitHub ↗<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- card 6: Pingpin -->\n<div class=\"pf-card\" style=\"flex: 0 0 420px; height: 640px; box-sizing: border-box; border-radius: 28px; padding: 28px; background: #f3f1ec; color: #0e1116; display: flex; flex-direction: column; gap: 16px\">\n<div>\n<div style=\"font-size: 13px; opacity: 0.72\">Alibaba Cloud ECS · May 2026 – now<\u002Fdiv>\n<div style=\"font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; margin-top: 6px\">Pingpin<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.35; margin-top: 8px; opacity: 0.78; max-width: 330px\">Five agents. The last call stays with the seller.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px\">\n<div style=\"font-size: 10.5px; letter-spacing: 0.12em; opacity: 0.6\">LLM AGENTS<\u002Fdiv>\n<div style=\"position: relative; display: flex; justify-content: space-between; align-items: center\">\n<div style=\"position: absolute; left: 17px; right: 17px; top: 50%; height: 1.5px; background: rgba(14,17,22,0.3)\"><\u002Fdiv>\n<div style=\"position: relative; width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #0e1116; background: #f3f1ec; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">1<\u002Fdiv>\n<div style=\"position: relative; width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #0e1116; background: #f3f1ec; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">2<\u002Fdiv>\n<div style=\"position: relative; width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #0e1116; background: #f3f1ec; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">3<\u002Fdiv>\n<div style=\"position: relative; width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #0e1116; background: #f3f1ec; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">4<\u002Fdiv>\n<div style=\"position: relative; width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #0e1116; background: #f3f1ec; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">5<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height: 46px; border-radius: 12px; background: #0e1116; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">Deterministic rules gate before any LLM scoring<\u002Fdiv>\n<div style=\"font-size: 10.5px; letter-spacing: 0.12em; opacity: 0.6\">HUMAN APPROVAL<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div style=\"width: 34px; height: 34px; border-radius: 9px; box-sizing: border-box; border: 1.5px solid #0e1116; display: flex; align-items: center; justify-content: center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0e1116\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"width: 34px; height: 34px; border-radius: 9px; box-sizing: border-box; border: 1.5px solid #0e1116; display: flex; align-items: center; justify-content: center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0e1116\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"font-size: 12.5px; opacity: 0.75\">two checkpoints before anything ships<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.5; opacity: 0.85\">A LangGraph pipeline that drafts Etsy listing copy and screens it against the real seller policies. Built to run a controlled experiment: human, AI and human-AI copy across six live listings.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px\">\n<span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">LangGraph<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">FastAPI<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">RAG / Chroma<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">Qwen<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 20px; font-size: 13.5px; font-weight: 600\">\n<a href=\"https://www.youtube.com/watch?v=YlkuLmvhE8E\" style=\"text-decoration: underline; text-underline-offset: 4px\">Video walkthrough ↗<\u002Fa>\n<a href=\"https://github.com/Neofirst0715/Etsy-Multi-Agents-Project\" style=\"text-decoration: underline; text-underline-offset: 4px\">GitHub ↗<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 0 0 40px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div id=\"pf-shade-proj\" ref=\"{{projShadeRef}}\" style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000000; opacity: 0; pointer-events: none; z-index: 40\"><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ APPROACH ============ -->\n<div id=\"approach\" ref=\"{{approachRef}}\" style=\"position: sticky; top: min(0px, calc(100vh - 720px)); z-index: 3; height: max(100vh, 720px); box-sizing: border-box; padding: 0 64px; display: flex; flex-direction: column; justify-content: center; border-radius: 36px 36px 0 0; overflow: hidden; background: #f6f5f2; color: #0e1116; will-change: transform\">\n<div style=\"font-size: 36px; font-weight: 500; line-height: 1.18; letter-spacing: -0.02em; max-width: 900px\">One habit runs through all six —\n<div style=\"color: #7b828c; font-weight: 400\">the model drafts, code decides, a human signs off.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 48px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px\">\n<div style=\"box-sizing: border-box; padding: 32px; border-radius: 28px; background: #ffffff; display: flex; flex-direction: column; gap: 14px; min-height: 300px\">\n<div style=\"font-size: 13px; color: #5b626b\">01 · Proposes<\u002Fdiv>\n<div style=\"font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2\">The model drafts.<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.55; color: #3d444d\">LLMs are good at first passes: copy, extraction, screening. That is all I ask of them. In Pingpin the agents draft and never publish, and it runs against my own Etsy shop, PingPinGo, so it meets real seller conditions.<\u002Fdiv>\n<div style=\"flex-grow: 1\"><\u002Fdiv>\n<div style=\"font-size: 12.5px; color: #5b626b\">Seen in Pingpin and PingPinGo, Volta<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"box-sizing: border-box; padding: 32px; border-radius: 28px; background: #0e1116; color: #ffffff; display: flex; flex-direction: column; gap: 14px; min-height: 300px\">\n<div style=\"font-size: 13px; opacity: 0.7\">02 · Decides<\u002Fdiv>\n<div style=\"font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2\">Code decides.<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.55; opacity: 0.85\">At Volta the model miscounted items in testing, so every status decision moved into deterministic Python and the model only drafts. In Pingpin, rules gate before any LLM scoring.<\u002Fdiv>\n<div style=\"flex-grow: 1\"><\u002Fdiv>\n<div style=\"font-size: 12.5px; opacity: 0.7\">127 automated tests behind it<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"box-sizing: border-box; padding: 32px; border-radius: 28px; background: #ffffff; display: flex; flex-direction: column; gap: 14px; min-height: 300px\">\n<div style=\"font-size: 13px; color: #5b626b\">03 · Signs off<\u002Fdiv>\n<div style=\"font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2\">A human signs off. There is always a fallback. tyle=\"font-size: 11px; opacity: 0.55\">schematic, not real readings<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.5; opacity: 0.85\">A live sea-surface-temperature pipeline for four Nova Scotia sites. I built the data layer and the Hobday et al. heatwave detection, then turned it into plain-language alerts a farm operator can act on.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px\">\n<span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">Next.js<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">TypeScript<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">NOAA ERDDAP<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">team of 2<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 20px; font-size: 13.5px; font-weight: 600\">\n<a href=\"https://bluefish-ivory.vercel.app\" style=\"text-decoration: underline; text-underline-offset: 4px\">Live demo ↗<\u002Fa>\n<a href=\"https://github.com/Neofirst0715/Bluefish\" style=\"text-decoration: underline; text-underline-offset: 4px\">GitHub ↗<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div class=\"pf-card\" style=\"flex: 0 0 420px; height: 640px; box-sizing: border-box; border-radius: 28px; padding: 28px; background: #eef1f4; color: #0e1116; display: flex; flex-direction: column; gap: 16px\">\n<div>\n<div style=\"font-size: 13px; opacity: 0.72\">DeepSense Ocean of Data · Jun 2026<\u002Fdiv>\n<div style=\"font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; margin-top: 6px\">RaceLens AR<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.35; margin-top: 8px; opacity: 0.78; max-width: 330px\">Measured, ruled, or guessed. Always labelled.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-radius: 12px; background: #0e1116; color: #ffffff; font-size: 13.5px; font-weight: 600\"><span>Live fact<\u002Fspan><span style=\"font-weight: 500; opacity: 0.7\">measured<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-radius: 12px; box-sizing: border-box; border: 1.5px dashed #0e1116; font-size: 13.5px; font-weight: 600\"><span>Rule-triggered event<\u002Fspan><span style=\"font-weight: 500; opacity: 0.7\">rule<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-radius: 12px; box-sizing: border-box; border: 1.5px dotted rgba(14,17,22,0.55); font-size: 13.5px; font-weight: 600; color: rgba(14,17,22,0.8)\"><span>ML prediction<\u002Fspan><span style=\"font-weight: 500; opacity: 0.7\">model guess<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size: 46px; font-weight: 300; letter-spacing: -0.03em; line-height: 1\">52% → 70%<\u002Fdiv>\n<div style=\"font-size: 12.5px; opacity: 0.7; margin-top: 8px\">event-classification accuracy on unseen races<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.5; opacity: 0.85\">SailGP telemetry turned into spectator insight. I engineered four rolling-window features and trained the Random Forest; judges singled out the honest three-tier framing.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px\">\n<span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">Random Forest<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">React<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">Tableau<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">team of 2<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 20px; font-size: 13.5px; font-weight: 600\">\n<a href=\"https://www.youtube.com/watch?v=6CRQKmfGGpU\" style=\"text-decoration: underline; text-underline-offset: 4px\">Video demo ↗<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div class=\"pf-card\" style=\"flex: 0 0 420px; height: 640px; box-sizing: border-box; border-radius: 28px; padding: 28px; background: #17202b; color: #ffffff; display: flex; flex-direction: column; gap: 16px\">\n<div>\n<div style=\"font-size: 13px; opacity: 0.72\">Devpost submission · Jul – Aug 2026<\u002Fdiv>\n<div style=\"font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; margin-top: 6px\">Pingpin Context<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.35; margin-top: 8px; opacity: 0.78; max-width: 330px\">Every rewrite leaves a trail.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex-grow: 1; display: flex; flex-direction: column; justify-content: center\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 30px; height: 30px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #f0b56b; color: #f0b56b; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600\">1<\u002Fdiv>\n<div style=\"font-size: 14.5px\">Stale record flagged <span style=\"opacity: 0.6\">· 1+ day past its last update<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width: 1.5px; height: 26px; margin-left: 14px; background: rgba(255,255,255,0.25)\"><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 30px; height: 30px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #f0b56b; color: #f0b56b; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600\">2<\u002Fdiv>\n<div style=\"font-size: 14.5px\">A human approves or overrides<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width: 1.5px; height: 26px; margin-left: 14px; background: rgba(255,255,255,0.25)\"><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 30px; height: 30px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #f0b56b; color: #f0b56b; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600\">3<\u002Fdiv>\n<div style=\"font-size: 14.5px\">Rewrite versioned into the lineage graph<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 26px; align-self: flex-start; padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); font-size: 12.5px\">2–3 overrides every review round<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.5; opacity: 0.85\">A daily freshness check on a live dbt project. Every flag goes to human approval, including the reviewer's own edits being re-flagged, and every approved rewrite lands in DataHub's lineage graph.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px\">\n<span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">dbt<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">DuckDB<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">DataHub (MCP)<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)\">LangGraph<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 20px; font-size: 13.5px; font-weight: 600\">\n<a href=\"https://www.youtube.com/watch?v=KWrZzPhWuZs\" style=\"text-decoration: underline; text-underline-offset: 4px\">Video walkthrough ↗<\u002Fa>\n<a href=\"https://github.com/Neofirst0715/Pingpin-context\" style=\"text-decoration: underline; text-underline-offset: 4px\">GitHub ↗<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div class=\"pf-card\" style=\"flex: 0 0 420px; height: 640px; box-sizing: border-box; border-radius: 28px; padding: 28px; background: #f3f1ec; color: #0e1116; display: flex; flex-direction: column; gap: 16px\">\n<div>\n<div style=\"font-size: 13px; opacity: 0.72\">Alibaba Cloud ECS · May 2026 – now<\u002Fdiv>\n<div style=\"font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; margin-top: 6px\">Pingpin<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.35; margin-top: 8px; opacity: 0.78; max-width: 330px\">Five agents. The last call stays with the seller.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px\">\n<div style=\"font-size: 10.5px; letter-spacing: 0.12em; opacity: 0.6\">LLM AGENTS<\u002Fdiv>\n<div style=\"position: relative; display: flex; justify-content: space-between; align-items: center\">\n<div style=\"position: absolute; left: 17px; right: 17px; top: 50%; height: 1.5px; background: rgba(14,17,22,0.3)\"><\u002Fdiv>\n<div style=\"position: relative; width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #0e1116; background: #f3f1ec; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">1<\u002Fdiv>\n<div style=\"position: relative; width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #0e1116; background: #f3f1ec; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">2<\u002Fdiv>\n<div style=\"position: relative; width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #0e1116; background: #f3f1ec; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">3<\u002Fdiv>\n<div style=\"position: relative; width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #0e1116; background: #f3f1ec; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">4<\u002Fdiv>\n<div style=\"position: relative; width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #0e1116; background: #f3f1ec; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">5<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height: 46px; border-radius: 12px; background: #0e1116; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">Deterministic rules gate before any LLM scoring<\u002Fdiv>\n<div style=\"font-size: 10.5px; letter-spacing: 0.12em; opacity: 0.6\">HUMAN APPROVAL<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<div style=\"width: 34px; height: 34px; border-radius: 9px; box-sizing: border-box; border: 1.5px solid #0e1116; display: flex; align-items: center; justify-content: center\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0e1116\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"width: 34px; height: 34px; border-radius: 9px; box-sizing: border-box; border: 1.5px solid #0e1116; display: flex; align-items: center; justify-content: center\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0e1116\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"font-size: 12.5px; opacity: 0.75\">two checkpoints before anything ships<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.5; opacity: 0.85\">A LangGraph pipeline that drafts Etsy listing copy and screens it against the real seller policies. Built to run a controlled experiment: human, AI and human-AI copy across six live listings.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px\">\n<span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">LangGraph<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">FastAPI<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">RAG / Chroma<\u002Fspan><span style=\"padding: 4px 10px; border-radius: 999px; background: rgba(14,17,22,0.07)\">Qwen<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 20px; font-size: 13.5px; font-weight: 600\">\n<a href=\"https://www.youtube.com/watch?v=YlkuLmvhE8E\" style=\"text-decoration: underline; text-underline-offset: 4px\">Video walkthrough ↗<\u002Fa>\n<a href=\"https://github.com/Neofirst0715/Etsy-Multi-Agents-Project\" style=\"text-decoration: underline; text-underline-offset: 4px\">GitHub ↗<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 0 0 40px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div id=\"pf-shade-proj\" style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000000; opacity: 0; pointer-events: none; z-index: 40\"><\u002Fdiv>\n<\u002Fdiv>\n\n\n<div id=\"approach\" style=\"position: sticky; top: min(0px, calc(100vh - 720px)); z-index: 3; height: max(100vh, 720px); box-sizing: border-box; padding: 0 64px; display: flex; flex-direction: column; justify-content: center; border-radius: 36px 36px 0 0; overflow: hidden; background: #f6f5f2; color: #0e1116; will-change: transform\">\n<div style=\"font-size: 36px; font-weight: 500; line-height: 1.18; letter-spacing: -0.02em; max-width: 900px\">One habit runs through all six —\n<div style=\"color: #7b828c; font-weight: 400\">the model drafts, code decides, a human signs off.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 48px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px\">\n<div style=\"box-sizing: border-box; padding: 32px; border-radius: 28px; background: #ffffff; display: flex; flex-direction: column; gap: 14px; min-height: 300px\">\n<div style=\"font-size: 13px; color: #5b626b\">01 · Proposes<\u002Fdiv>\n<div style=\"font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2\">The model drafts.<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.55; color: #3d444d\">LLMs are good at first passes: copy, extraction, screening. That is all I ask of them. In Pingpin the agents draft and never publish, and it runs against my own Etsy shop, PingPinGo, so it meets real seller conditions.<\u002Fdiv>\n<div style=\"flex-grow: 1\"><\u002Fdiv>\n<div style=\"font-size: 12.5px; color: #5b626b\">Seen in Pingpin and PingPinGo, Volta<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"box-sizing: border-box; padding: 32px; border-radius: 28px; background: #0e1116; color: #ffffff; display: flex; flex-direction: column; gap: 14px; min-height: 300px\">\n<div style=\"font-size: 13px; opacity: 0.7\">02 · Decides<\u002Fdiv>\n<div style=\"font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2\">Code decides.<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.55; opacity: 0.85\">At Volta the model miscounted items in testing, so every status decision moved into deterministic Python and the model only drafts. In Pingpin, rules gate before any LLM scoring.<\u002Fdiv>\n<div style=\"flex-grow: 1\"><\u002Fdiv>\n<div style=\"font-size: 12.5px; opacity: 0.7\">127 automated tests behind it<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"box-sizing: border-box; padding: 32px; border-radius: 28px; background: #ffffff; display: flex; flex-direction: column; gap: 14px; min-height: 300px\">\n<div style=\"font-size: 13px; color: #5b626b\">03 · Signs off<\u002Fdiv>\n<div style=\"font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2\">A human signs off. There is always a fallback.<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.55; color: #3d444d\">Approval checkpoints in Pingpin and Pingpin Context; automatic local-to-Gemini failover in Expense Scanner, so the feature still returns something when a dependency dies.<\u002Fdiv>\n<div style=\"flex-grow: 1\"><\u002Fdiv>\n<div style=\"font-size: 12.5px; color: #5b626b\">Seen in Pingpin Context, Expense Scanner<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div id=\"pf-shade-appr\" style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000000; opacity: 0; pointer-events: none; z-index: 40\"><\u002Fdiv>\n<\u002Fdiv>\n\n\n<div id=\"contact\" style=\"position: relative; z-index: 4; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; overflow: hidden; padding: 96px 64px 96px 64px; box-sizing: border-box; background: #0a1420; color: #ffffff\">\n<div style=\"position: absolute; left: 30%; top: 40px; width: 900px; height: 240px; border-radius: 50%; background: #14506a; opacity: 0.55; filter: blur(90px)\"><\u002Fdiv>\n<div style=\"position: absolute; left: 40%; top: 130px; width: 620px; height: 60px; border-radius: 50%; background: #f0b56b; opacity: 0.35; filter: blur(50px); transform: rotate(-5deg)\"><\u002Fdiv>\n<div style=\"position: relative\">\n<h2 style=\"margin: 0; font-size: 64px; font-weight: 300; line-height: 1.06; letter-spacing: -0.025em\">Let's build something<br>that fails gracefully.<\u002Fh2>\n<div style=\"margin-top: 40px; display: flex; align-items: center; gap: 12px\">\n<a href=\"mailto:neofirst778@gmail.com\" style=\"display: flex; align-items: center; height: 52px; padding: 0 28px; box-sizing: border-box; border-radius: 999px; background: #ffffff; color: #0e1116; font-size: 15px; font-weight: 700\">neofirst778@gmail.com<\u002Fa>\n<a href=\"https://github.com/Neofirst0715\" style=\"display: flex; align-items: center; height: 52px; padding: 0 24px; box-sizing: border-box; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); font-size: 15px; font-weight: 600\">GitHub ↗<\u002Fa>\n<a href=\"https://www.linkedin.com/in/neo-li-b2a22428a\" style=\"display: flex; align-items: center; height: 52px; padding: 0 24px; box-sizing: border-box; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); font-size: 15px; font-weight: 600\">LinkedIn ↗<\u002Fa>\n<\u002Fdiv>\n<div style=\"margin-top: 96px; display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,0.65)\">\n<span>Zhenzhao Li · Halifax, NS · Dalhousie University, Computer Science, 2028<\u002Fspan>\n<span>Open to co-op from January 2027<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f0b56b&quot;,&quot;options&quot;:[&quot;#f0b56b&quot;,&quot;#7fd1c7&quot;,&quot;#a8b8ff&quot;,&quot;#ff9e80&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:3000}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._onScroll = () => this._schedule();\n    window.addEventListener('scroll', this._onScroll, true);\n    window.addEventListener('resize', this._onScroll);\n    this._schedule();\n    this._syncArrows();\n  }\n  componentDidUpdate() { this._schedule(); }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll, true);\n    window.removeEventListener('resize', this._onScroll);\n    if (this._raf) cancelAnimationFrame(this._raf);\n  }\n\n  _q(key, id) {\n    return this[key] || (typeof document !== 'undefined' ? document.getElementById(id) : null);\n  }\n  _schedule() {\n    if (this._raf) return;\n    this._raf = requestAnimationFrame(() => { this._raf = 0; this._apply(); });\n  }\n\n  // Apple-style stacking: the layer underneath recedes (shrinks, rises a little, dims)\n  // while the next layer slides over it; scrolling back up restores it.\n  _apply() {\n    const vh = window.innerHeight || 800;\n    const hero = this._q('_hero', 'top');\n    const projects = this._q('_projects', 'projects');\n    const approach = this._q('_approach', 'approach');\n    const contact = this._q('_contact', 'contact');\n    const items = [\n      { el: hero, shade: this._q('_heroShade', 'pf-shade-hero'), base: '0px', r0: 0, next: projects },\n      { el: projects, shade: this._q('_projShade', 'pf-shade-proj'), base: '36px 36px 0px 0px', r0: 36, next: approach },\n      { el: approach, shade: this._q('_apprShade', 'pf-shade-appr'), base: '36px 36px 0px 0px', r0: 36, next: contact }\n    ];\n    const ps = [0, 0, 0];\n    let covered = false;\n    for (let i = 2; i >= 0; i--) {\n      const it = items[i];\n      if (!it.el) continue;\n      let p = 1;\n      if (!covered) {\n        const top = it.next ? it.next.getBoundingClientRect().top : vh;\n        p = Math.max(0, Math.min(1, 1 - top / vh));\n      }\n      ps[i] = p;\n      this._paint(it, p);\n      if (p > 0) covered = true;\n    }\n    // layers that are fully tucked away are hidden so they never show as nested frames\n    for (let j = 0; j < 3; j++) {\n      const it = items[j];\n      if (!it.el) continue;\n      const hide = ps[j] >= 0.9995 && (j === 2 || ps[j + 1] > 0.0005);\n      it.el.style.visibility = hide ? 'hidden' : '';\n    }\n    // the colour revealed around the shrinking layer is the colour of the layer coming in\n    const REVEAL = ['#ffffff', '#f6f5f2', '#0a1420'];\n    let active = -1;\n    for (let k = 0; k < 3; k++) if (ps[k] > 0.0005 && ps[k] < 0.9995) active = k;\n    const root = this._q('_root', 'pf-root');\n    if (root) root.style.background = active >= 0 ? REVEAL[active] : REVEAL[0];\n  }\n  _paint(it, p) {\n    const el = it.el;\n    if (p <= 0.0005) {\n      el.style.transform = '';\n      el.style.borderRadius = it.base;\n      if (it.shade) it.shade.style.opacity = '0';\n      return;\n    }\n    const rb = 30 * p;\n    const rt = Math.max(it.r0, rb);\n    el.style.transformOrigin = '50% 35%';\n    el.style.transform = 'translate3d(0,' + (-30 * p) + 'px,0) scale(' + (1 - 0.06 * p) + ')';\n    el.style.borderRadius = rt + 'px ' + rt + 'px ' + rb + 'px ' + rb + 'px';\n    if (it.shade) it.shade.style.opacity = String(0.1 * p);\n  }\n\n  // carousel: native swipe / trackpad scroll, arrows, and mouse drag\n  _track_() { return this._q('_track', 'pf-track'); }\n  _nudge(dir) {\n    const t = this._track_();\n    if (!t) return;\n    const card = t.querySelector('.pf-card');\n    const step = card ? card.getBoundingClientRect().width + 24 : 444;\n    t.scrollBy({ left: dir * step, behavior: 'smooth' });\n  }\n  _syncArrows() {\n    const t = this._track_();\n    if (!t) return;\n    const atStart = t.scrollLeft <= 6;\n    const atEnd = t.scrollLeft >= t.scrollWidth - t.clientWidth - 6;\n    const s = this.state || {};\n    if (s.atStart !== atStart || s.atEnd !== atEnd) this.setState({ atStart: atStart, atEnd: atEnd });\n  }\n\n  renderVals() {\n    const s = this.state || {};\n    const atStart = s.atStart === undefined ? true : s.atStart;\n    const atEnd = !!s.atEnd;\n    if (!this._refs) {\n      this._refs = {\n        heroRef: (el) => { this._hero = el; },\n        projectsRef: (el) => { this._projects = el; },\n        approachRef: (el) => { this._approach = el; },\n        contactRef: (el) => { this._contact = el; },\n        heroShadeRef: (el) => { this._heroShade = el; },\n        projShadeRef: (el) => { this._projShade = el; },\n        apprShadeRef: (el) => { this._apprShade = el; },\n        trackRef: (el) => { this._track = el; },\n        rootRef: (el) => { this._root = el; }\n      };\n    }\n    return {\n      accent: this.props.accent ?? '#f0b56b',\n      heroRef: this._refs.heroRef,\n      projectsRef: this._refs.projectsRef,\n      approachRef: this._refs.approachRef,\n      contactRef: this._refs.contactRef,\n      heroShadeRef: this._refs.heroShadeRef,\n      projShadeRef: this._refs.projShadeRef,\n      apprShadeRef: this._refs.apprShadeRef,\n      trackRef: this._refs.trackRef,\n      rootRef: this._refs.rootRef,\n      trackScroll: () => this._syncArrows(),\n      prev: () => this._nudge(-1),\n      next: () => this._nudge(1),\n      prevDisabled: atStart,\n      nextDisabled: atEnd,\n      prevOpacity: atStart ? 0.35 : 1,\n      nextOpacity: atEnd ? 0.35 : 1,\n      dragDown: (e) => {\n        if ((e.pointerType && e.pointerType !== 'mouse') || e.button !== 0) return;\n        const t = this._track_();\n        if (!t) return;\n        e.preventDefault();\n        this._drag = { x: e.clientX, left: t.scrollLeft, moved: false };\n        t.style.scrollSnapType = 'none';\n        t.style.cursor = 'grabbing';\n      },\n      dragMove: (e) => {\n        const d = this._drag;\n        if (!d) return;\n        const dx = e.clientX - d.x;\n        if (Math.abs(dx) > 4) d.moved = true;\n        this._track_().scrollLeft = d.left - dx;\n      },\n      dragUp: () => {\n        const d = this._drag;\n        if (!d) return;\n        this._drag = null;\n        const t = this._track_();\n        if (!t) return;\n        t.style.cursor = '';\n        t.style.scrollSnapType = '';\n        if (d.moved) {\n          this._suppressClick = true;\n          const card = t.querySelector('.pf-card');\n          const step = card ? card.getBoundingClientRect().width + 24 : 444;\n          t.scrollTo({ left: Math.round(t.scrollLeft / step) * step, behavior: 'smooth' });\n        }\n      },\n      dragClick: (e) => {\n        if (this._suppressClick) {\n          this._suppressClick = false;\n          e.preventDefault();\n          e.stopPropagation();\n        }\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
